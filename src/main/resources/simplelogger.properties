# SLF4J writes to stderr. On stdio, stdout carries the MCP protocol and must stay clean.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
# Stopping a stdio server on purpose ends it with a non-zero code on Windows, which this logs as a
# warning on every normal exit. A real crash still shows up in the mcp_session_failed event.
org.slf4j.simpleLogger.log.io.modelcontextprotocol.client.transport.StdioClientTransport=error
