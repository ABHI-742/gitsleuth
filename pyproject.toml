[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsleuth"
version = "0.1.0"
description = "A Claude agent that answers questions about a git repository's history through MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=2.3,<3",
    "jsonschema>=4.26,<5",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[project.scripts]
gitsleuth = "gitsleuth.cli:main"
gitsleuth-server = "gitsleuth.servers.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# The timeout parameters are forwarded to the MCP SDK, which enforces them.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC210", "ASYNC221", "ASYNC251"]
